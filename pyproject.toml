[project]
name = "stock-forecast-vs-reality"
version = "0.1.0"
description = "Compare real stock prices against a model's expected range, and explain breakouts with an LLM agent."
requires-python = ">=3.12"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.2",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false
